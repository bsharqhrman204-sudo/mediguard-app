<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediGuard AI - Global Enterprise MAX</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-purple: #8b5cf6;
            --accent-teal: #14b8a6;
            --accent-blue-light: #38bdf8;
            --accent-pink: #ec4899;
            --accent-indigo: #6366f1;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }

        .app-container { width: 100%; max-width: 1100px; height: 95vh; background: var(--card-bg); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }

        .app-header { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; font-weight: 700; color: var(--primary); }
        .header-actions { display: flex; align-items: center; gap: 12px; }

        .lang-select { background: #0f172a; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 12px; border-radius: 12px; font-size: 0.85rem; outline: none; cursor: pointer; }

        .feature-bar { display: flex; gap: 8px; padding: 12px 20px; background: rgba(0,0,0,0.2); overflow-x: auto; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .f-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-light); padding: 8px 12px; border-radius: 12px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; transition: 0.2s; }
        .f-btn:hover { background: var(--primary); }
        .f-btn.emergency { background: rgba(239, 68, 68, 0.2); border-color: var(--accent-red); color: #fca5a5; }
        .f-btn.security-btn { background: rgba(139, 92, 246, 0.2); border-color: var(--accent-purple); color: #c4b5fd; }
        .f-btn.qr-btn { background: rgba(99, 102, 241, 0.2); border-color: var(--accent-indigo); color: #c7d2fe; }
        .f-btn.vitals-btn { background: rgba(16, 185, 129, 0.2); border-color: var(--accent-green); color: #6ee7b7; }
        .f-btn.booking-btn { background: rgba(20, 184, 166, 0.2); border-color: var(--accent-teal); color: #5eead4; }
        .f-btn.pink-btn { background: rgba(236, 72, 153, 0.2); border-color: var(--accent-pink); color: #fbcfe8; }

        .workspace { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #0f172a; }
        .msg { max-width: 80%; padding: 14px 18px; border-radius: 18px; font-size: 0.95rem; line-height: 1.6; word-wrap: break-word; }
        .bot-msg { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-right-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .user-msg { background: var(--primary); color: white; align-self: flex-end; border-bottom-left-radius: 4px; }

        .input-panel { padding: 15px 20px; background: var(--card-bg); border-top: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 10px; }
        .input-wrapper { display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; background: #0f172a; border: 1px solid rgba(255,255,255,0.15); border-radius: 30px; padding: 12px 20px; color: white; font-size: 0.95rem; outline: none; }

        .act-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #0f172a; color: var(--text-muted); display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.1rem; border: 1px solid rgba(255,255,255,0.1); }
        .send-btn { background: var(--primary); color: white; border-radius: 30px; padding: 0 22px; font-weight: bold; width: auto; }

        .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--text-muted); padding: 0 5px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="brand">
                <i class="fa-solid fa-heart-pulse"></i> MediGuard AI <span style="font-size:0.65rem; background:var(--primary); color:white; padding:2px 6px; border-radius:6px;">ENTERPRISE MAX</span>
            </div>
            <div class="header-actions">
                <select class="lang-select" id="langSelect" onchange="setLanguage(this.value)">
                    <option value="ar">العربية (Arabic)</option>
                    <option value="en">English (US)</option>
                    <option value="tr">Türkçe (Turkish)</option>
                    <option value="fr">Français (French)</option>
                    <option value="de">Deutsch (German)</option>
                    <option value="es">Español (Spanish)</option>
                </select>
            </div>
        </header>

        <div class="feature-bar">
            <button class="f-btn security-btn" onclick="setupSecurityLock()"><i class="fa-solid fa-user-lock"></i> <span id="lblLock">قفل الـ PIN والهوية</span></button>
            <button class="f-btn emergency" onclick="triggerEmergency()"><i class="fa-solid fa-triangle-exclamation"></i> <span id="lblEmergency">طوارئ البلد</span></button>
            <button class="f-btn emergency" onclick="openFirstAidGuide()"><i class="fa-solid fa-kit-medical"></i> <span id="lblFirstAid">دليل الإسعافات</span></button>
            <button class="f-btn qr-btn" onclick="generateEmergencyQR()"><i class="fa-solid fa-qrcode"></i> <span id="lblQR">بطاقة QR</span></button>
            <button class="f-btn vitals-btn" onclick="openVitalsTracker()"><i class="fa-solid fa-wave-square"></i> <span id="lblVitals">العلامات الحيوية</span></button>

            <button class="f-btn pink-btn" onclick="openMaternalHealth()"><i class="fa-solid fa-baby-carriage"></i> <span id="lblMaternal">متابعة الحمل</span></button>
            <button class="f-btn" onclick="calculatePediatricDose()"><i class="fa-solid fa-syringe"></i> <span id="lblDose">جرعات الأطفال</span></button>

            <button class="f-btn booking-btn" onclick="openAppointmentBooking()"><i class="fa-solid fa-calendar-check"></i> <span id="lblBooking">حجز مواعيد</span></button>
            <button class="f-btn" onclick="openPatientProfiles()"><i class="fa-solid fa-users-medical"></i> <span id="lblProfiles">سجلات المرضى</span></button>
            <button class="f-btn" onclick="checkSideEffects()"><i class="fa-solid fa-shield-virus"></i> <span id="lblSideEffects">الآثار والتحذيرات</span></button>
            <button class="f-btn" onclick="checkDrugInteractions()"><i class="fa-solid fa-capsules"></i> <span id="lblInteractions">تعارض الأدوية</span></button>
            
            <button class="f-btn" onclick="checkMedicationStock()"><i class="fa-solid fa-pills"></i> <span id="lblMedCheck">توفر الأدوية</span></button>
            <button class="f-btn" onclick="findNearbyFacilities()"><i class="fa-solid fa-hospital-user"></i> <span id="lblHospitals">المشافي القريبة</span></button>
            <button class="f-btn" onclick="exportMedicalPDF()"><i class="fa-solid fa-file-pdf"></i> <span id="lblExport">تصدير PDF</span></button>
            <button class="f-btn" onclick="backupSystemData()"><i class="fa-solid fa-database"></i> <span id="lblBackup">نسخ احتياطي</span></button>
            <button class="f-btn" onclick="clearHistory()"><i class="fa-solid fa-trash-can"></i> <span id="lblClear">مسح السجل</span></button>
        </div>

        <div class="workspace" id="chatWorkspace">
            <div class="msg bot-msg" id="welcomeMsg">
                مرحباً بك في المنظومة الطبية الشاملة MediGuard AI Enterprise MAX. تمت إضافة نظام القفل السري PIN وتأمين هوية المستخدم محلياً بنجاح.
            </div>
        </div>

        <div class="input-panel">
            <div class="input-wrapper">
                <label class="act-btn" title="الماسح الضوئي الطبي">
                    <i class="fa-solid fa-camera"></i>
                    <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="handleVisionScan(event)">
                </label>

                <button class="act-btn" title="المساعد الصوتي" onclick="toggleVoiceInput()"><i class="fa-solid fa-microphone"></i></button>
                <button class="act-btn" title="قراءة التقرير صوتاً" onclick="speakLastResponse()"><i class="fa-solid fa-volume-high"></i></button>

                <input type="text" id="userInput" placeholder="اسأل سؤالاً طبياً، أو ارفع صورة تقرير/وصفة..." onkeypress="handleKey(event)">

                <button class="act-btn send-btn" onclick="processQuery()" id="btnSend">إرسال</button>
            </div>

            <div class="status-bar">
                <span class="sec-badge"><i class="fa-solid fa-shield-halved"></i> <span>تشفير طبي كامل End-to-End مع حماية PIN</span></span>
                <span>تنبيه: أداة توعوية طبية وليست بديلاً عن التشخيص المباشر</span>
            </div>
        </div>
    </div>

    <script src="src/main.js"></script>
</body>
</html>
<link rel="manifest" href="manifest.json">
